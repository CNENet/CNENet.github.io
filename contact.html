<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Contact CNENet UK – Clinical Nurse Educator Network UK">
<title>CNENet UK – Contact</title>

<style>
/* ========================
   Base Styles
======================== */
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    line-height: 1.6;
    color: #333;
}

p {
    margin: 15px 0;
}

h1, h2 {
    color: #003366;
    margin-top: 20px;
    text-align: center;
}

/* Buttons */
.button-link {
    display: inline-block;
    background-color: #003366;
    color: #ffffff;
    padding: 12px 25px;
    text-decoration: none;
    border-radius: 5px;
    font-weight: bold;
    margin: 15px 0;
    transition: background-color 0.2s;
}
.button-link:hover { background-color: #0055a5; }

/* ========================
   Navbar
======================== */
.navbar {
    background-color: #ffffff;
    padding: 6px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid #e0e6ed;
}
.nav-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.nav-logo img {
    height: 70px;
    cursor: pointer;
    opacity: 0;
    transform: translateY(-20px);
    transition: transform 0.3s ease, opacity 0.3s ease;
}
.nav-logo img.visible {
    opacity: 1;
    transform: translateY(0);
}
.nav-links {
    list-style: none;
    display: flex;
    gap: 20px;
    margin: 0;
}
.nav-links li a {
    color: #003366;
    text-decoration: none;
    font-weight: bold;
    padding: 6px 12px;
    border-radius: 5px;
    transition: background-color 0.2s;
}
.nav-links li a.button-link {
    color: #ffffff !important;
    background-color: #003366;
}
.nav-links li a:hover { background-color: #e6edf5; }

/* Mobile */
.hamburger { display: none; flex-direction: column; cursor: pointer; gap: 4px; }
.hamburger span {
    width: 25px; height: 3px; background-color: #003366; border-radius: 2px;
}
.mobile-menu {
    display: none;
    list-style: none;
    background-color: #ffffff;
    border-bottom: 1px solid #e0e6ed;
}
.mobile-menu li a {
    display: block;
    padding: 10px 20px;
    color: #003366;
    text-decoration: none;
}
.mobile-menu li a:hover { background-color: #e6edf5; }
@media (max-width: 768px) {
    .nav-links { display: none; }
    .hamburger { display: flex; }
    .nav-logo img { height: 50px; }
}

/* ========================
   CNENet Section System
======================== */
.cnenet-section {
    width: 100%;
    padding: 60px 0;
}
.cnenet-section .container {
    max-width: 750px;
    margin: 0 auto;
    padding: 25px 30px;
    background-color: #ffffff;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

/* Section backgrounds */
.cnenet-section-light {
    background: linear-gradient(120deg, #f9fbfd 0%, #e6edf5 100%);
}
.cnenet-section-dark {
    background: linear-gradient(120deg, #f0f4f8 0%, #dbe6f2 100%);
}

/* ========================
   Embed Form Container
======================== */
.form-embed-wrapper {
    position: relative;
    width: 100%;
    min-height: 500px;
}
.form-embed-wrapper iframe {
    width: 100%;
    border: none;
}

/* ========================
   Social Icons
======================== */
.social-icons {
    text-align: center; margin-top: 25px;
}
.social-icons a {
    display: inline-block; margin: 0 10px;
}
.social-icons img {
    width: 40px; height: 40px; border-radius: 5px;
    opacity: 0; transform: translateY(10px);
    transition: transform 0.25s ease, opacity 0.25s ease;
}
.social-icons img.visible {
    opacity: 1; transform: translateY(0);
}
.social-icons img:hover { transform: scale(1.2); }

/* Footer */
footer {
    text-align: center;
    padding: 20px;
    font-size: 0.9em;
    color: #666;
}
</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <div class="nav-container">
        <a href="index.html" class="nav-logo">
            <img src="images/cnenetlogo.jpg" alt="CNENet Logo">
        </a>
        <ul class="nav-links">
            <li><a href="about.html">About</a></li>
          <li><a href="advocacy.html">Influence/a></li>    
          <li><a href="events.html">Events</a></li>
            <li><a href="join.html" class="button-link">Join Us</a></li>
        </ul>
        <div class="hamburger" onclick="toggleMobileMenu()">
            <span></span><span></span><span></span>
        </div>
    </div>
</nav>

<ul class="mobile-menu" id="mobileMenu">
    <li><a href="about.html">About</a></li>
    <li><a href="advocacy.html">Influence/a></li>    
    <li><a href="events.html">Events</a></li>
    <li><a href="join.html">Join Us</a></li>
</ul>

<!-- ========================
   Contact Section
========================= -->
<section class="cnenet-section cnenet-section-dark">
    <div class="container">
        <h1>Contact CNENet UK</h1>
        <p>Use the form below to get in touch with us. We’ll aim to respond within a few business days.</p>

        <!-- Tally form embed -->
        <div class="form-embed-wrapper">
            <iframe
                src="https://tally.so/embed/kdYolM?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
                data-tally-src="https://tally.so/embed/kdYolM?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
                loading="lazy"
            ></iframe>
        </div>
    </div>
</section>

<!-- ========================
   Social Icons
========================= -->
<div class="social-icons">
    <a href="https://www.facebook.com/groups/CNENet/" target="_blank" aria-label="Facebook">
        <img src="images/Facebook.png" alt="Facebook">
    </a>
    <a href="https://www.linkedin.com/company/cnenetwork/" target="_blank" aria-label="LinkedIn">
        <img src="images/LinkedIn.png" alt="LinkedIn">
    </a>
    <a href="https://x.com/CNENetworkUK" target="_blank" aria-label="X">
        <img src="images/X.png" alt="X (formerly Twitter)">
    </a>
</div>

<!-- Footer -->
<footer>
    <p>© 2026 by Clinical Nurse Educator Network UK licensed under 
        <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a>
    </p>
</footer>

<!-- JS -->
<script>
// Mobile menu toggle
function toggleMobileMenu() {
    const menu = document.getElementById("mobileMenu");
    menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
    menu.style.flexDirection = "column";
}

// Animate logo + social icons
window.addEventListener('load', () => {
    const logo = document.querySelector('.nav-logo img');
    if (logo) setTimeout(() => logo.classList.add('visible'), 100);

    document.querySelectorAll('.social-icons img').forEach((icon, i) => {
        setTimeout(() => icon.classList.add('visible'), 300 + i * 150);
    });
});
</script>

</body>
</html>
